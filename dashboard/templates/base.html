<!DOCTYPE html>
<html lang="{{ t.html_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ t.page_title }}{% endblock %}</title>
{% block head_extra %}{% endblock %}
<style>
  :root {
    --bg: #0f1419; --card: #1a2129; --border: #2a3441;
    --text: #e6edf3; --muted: #8b98a5; --accent: #4da3ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    max-width: 1200px; margin: 0 auto;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 4px; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 22px; line-height: 1.2; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; line-height: 1.4; }
  .header-right {
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    flex-shrink: 0;
  }
  .lang-switch { display: flex; gap: 4px; }
  .lang-switch a {
    padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); color: var(--muted);
    min-height: 36px; display: inline-flex; align-items: center;
  }
  .lang-switch a.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .nav a {
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); color: var(--muted);
    min-height: 40px; display: inline-flex; align-items: center; justify-content: center;
    text-align: center;
  }
  .nav a:hover { color: var(--text); border-color: var(--accent); }
  .nav a.active { background: rgba(77,163,255,.12); border-color: var(--accent); color: var(--accent); }
  .nav-short { display: none; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card .num { font-size: 28px; font-weight: 600; line-height: 1.1; }
  .card .label { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.35; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; max-width: 100%; overflow: hidden; }
  .panel h2 { font-size: 15px; margin-bottom: 14px; color: var(--accent); line-height: 1.35; overflow-wrap: break-word; }
  .subsection-title {
    font-size: 13px; font-weight: 500; color: var(--accent);
    margin-bottom: 10px; line-height: 1.35; overflow-wrap: break-word;
  }
  .subsection-title--spaced { margin-top: 18px; }
  .chart-block { margin-bottom: 18px; }
  .chart-block:last-child { margin-bottom: 0; }
  .chart-block > .table-wrap { margin-top: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .table-wrap {
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    margin: 0 -4px; padding: 0 4px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th {
    text-align: left; color: var(--muted); font-weight: 500;
    padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .data-table td {
    padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top;
  }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table td a { word-break: break-word; }
  .data-table .num { text-align: right; color: var(--muted); white-space: nowrap; width: 1%; }
  .data-table .col-time { white-space: nowrap; width: 1%; }
  .data-table .col-status { white-space: nowrap; width: 1%; }
  .data-table.compact td:first-child { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .data-table.compact td:last-child { font-weight: 600; }
  .data-table.word-table { table-layout: fixed; }
  .data-table.word-table td:first-child { overflow-wrap: anywhere; word-break: break-word; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; white-space: nowrap; }
  .b-posted  { background: rgba(63,185,80,.15);  color: var(--green); }
  .b-pending { background: rgba(210,153,34,.15); color: var(--yellow); }
  .b-skipped { background: rgba(248,81,73,.15);  color: var(--red); }
  .b-unknown { background: rgba(139,152,165,.15); color: var(--muted); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 12px 0; font-size: 13px; }
  .chart-box { position: relative; width: 100%; max-width: 100%; height: 260px; overflow: hidden; }
  .chart-box canvas { width: 100% !important; height: 100% !important; max-height: none; max-width: 100% !important; }
  .chart-box--tall, .chart-box--words { height: auto; min-height: 240px; }
  .chart-box--central { height: 240px; }
  a { color: var(--accent); text-decoration: none; }
  .click-hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .central-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .central-grid > * { min-width: 0; max-width: 100%; }
  .stats-line { font-size: 12px; margin-bottom: 14px; line-height: 1.5; overflow-wrap: anywhere; word-break: break-word; }
  #detailPanel h3 { font-size: 13px; margin-bottom: 10px; line-height: 1.35; word-break: break-word; color: var(--green); }
  #detailPanel--bucket h3 { color: var(--yellow); }
  .detail-panel { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .detail-panel.open { display: block; }
  .detail-scroll { max-height: 280px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  canvas#chartHist, #chartCentral { cursor: pointer; }

  @media (max-width: 800px) {
    .grid2, .central-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 640px) {
    body { padding: 14px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
    h1 { font-size: 18px; }
    .sub { font-size: 12px; margin-bottom: 16px; }
    .header { flex-direction: column; align-items: stretch; }
    .header-right { align-items: stretch; width: 100%; }
    .lang-switch { justify-content: flex-end; }
    .nav { width: 100%; }
    .nav a { flex: 1; padding: 10px 8px; font-size: 12px; }
    .nav-long { display: none; }
    .nav-short { display: inline; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
    .card { padding: 12px; border-radius: 8px; }
    .card .num { font-size: 22px; }
    .card .label { font-size: 11px; }
    .panel { padding: 14px; margin-bottom: 14px; border-radius: 8px; }
    .panel h2 { font-size: 14px; margin-bottom: 12px; }
    .grid2 { gap: 14px; }
    .chart-box { height: 220px; }
    .chart-box--tall, .chart-box--words { min-height: 200px; }
    .chart-box--central { height: 180px; }

    .subsection-title { font-size: 12px; margin-bottom: 8px; }
    .chart-block { margin-bottom: 14px; }

    .data-table { font-size: 11px; }
    .data-table th { font-size: 10px; padding: 4px 6px; }
    .data-table td { padding: 4px 6px; }
    .data-table .col-hide-mobile { display: none; }
    .data-table.compact td:first-child { font-size: 11px; }
    .data-table.compact td:last-child { font-size: 13px; }
  }
</style>
{% block styles %}{% endblock %}
</head>
<body>

<div class="header">
  <h1>{{ t.title }}</h1>
  <div class="header-right">
    <div class="lang-switch">
      <a href="{{ nav_url('ru') }}" class="{% if lang == 'ru' %}active{% endif %}">RU</a>
      <a href="{{ nav_url('en') }}" class="{% if lang == 'en' %}active{% endif %}">EN</a>
    </div>
    <nav class="nav">
      <a href="{{ url_for('index', lang=lang) }}" class="{% if active_nav == 'overview' %}active{% endif %}">{{ t.nav_overview }}</a>
      <a href="{{ url_for('metrics', lang=lang) }}" class="{% if active_nav == 'metrics' %}active{% endif %}">
        <span class="nav-long">{{ t.nav_metrics }}</span><span class="nav-short">{{ t.nav_metrics_short }}</span>
      </a>
    </nav>
  </div>
</div>
<div class="sub">{{ t.updated }}: {{ now }} (Europe/Belgrade)</div>

{% block content %}{% endblock %}

</body>
</html>
