<!DOCTYPE html>
<html lang="{{ t.html_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ t.page_title }}{% endblock %}</title>
{% block head_extra %}{% endblock %}
<style>
  :root {
    --bg: #0f1419; --card: #1a2129; --border: #2a3441;
    --text: #e6edf3; --muted: #8b98a5; --accent: #4da3ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px; max-width: 1200px; margin: 0 auto;
  }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; gap: 16px; }
  h1 { font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .lang-switch { display: flex; gap: 4px; }
  .lang-switch a {
    padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); color: var(--muted);
  }
  .lang-switch a.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav { display: flex; gap: 6px; }
  .nav a {
    padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); color: var(--muted);
  }
  .nav a:hover { color: var(--text); border-color: var(--accent); }
  .nav a.active { background: rgba(77,163,255,.12); border-color: var(--accent); color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card .num { font-size: 28px; font-weight: 600; }
  .card .label { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 15px; margin-bottom: 14px; color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 800px) { .grid2, .central-grid { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
  .b-posted  { background: rgba(63,185,80,.15);  color: var(--green); }
  .b-pending { background: rgba(210,153,34,.15); color: var(--yellow); }
  .b-skipped { background: rgba(248,81,73,.15);  color: var(--red); }
  .b-unknown { background: rgba(139,152,165,.15); color: var(--muted); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 12px 0; font-size: 13px; }
  canvas { max-height: 280px; }
  a { color: var(--accent); text-decoration: none; }
  .click-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  #bucketPanel, #centralPanel { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  #bucketPanel.open, #centralPanel.open { display: block; }
  #bucketPanel h3 { font-size: 14px; margin-bottom: 10px; color: var(--yellow); }
  #centralPanel h3 { font-size: 14px; margin-bottom: 10px; color: var(--green); }
  .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; max-height: 320px; overflow-y: auto; }
  .word-chip { display: flex; justify-content: space-between; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; }
  .word-chip .cnt { color: var(--muted); flex-shrink: 0; }
  canvas#chartHist, #chartCentral { cursor: pointer; }
  .central-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .central-table td:first-child { color: var(--muted); width: 140px; }
  .central-table td:last-child { font-weight: 600; font-size: 15px; }
  .central-table .hint { font-size: 11px; color: var(--muted); font-weight: 400; }
  #chartCentral { max-height: 200px; }
  .pole-title { font-size: 13px; color: var(--accent); margin-bottom: 8px; }
  .pole-high .word-chip { border-color: rgba(63,185,80,.4); }
  .pole-low .word-chip { border-color: rgba(139,152,165,.4); }
  .pole-out .word-chip { border-color: rgba(248,81,73,.4); }
</style>
{% block styles %}{% endblock %}
</head>
<body>

<div class="header">
  <h1>{{ t.title }}</h1>
  <div class="header-right">
    <div class="lang-switch">
      <a href="{{ nav_url('ru') }}" class="{% if lang == 'ru' %}active{% endif %}">RU</a>
      <a href="{{ nav_url('en') }}" class="{% if lang == 'en' %}active{% endif %}">EN</a>
    </div>
    <nav class="nav">
      <a href="{{ url_for('index', lang=lang) }}" class="{% if active_nav == 'overview' %}active{% endif %}">{{ t.nav_overview }}</a>
      <a href="{{ url_for('metrics', lang=lang) }}" class="{% if active_nav == 'metrics' %}active{% endif %}">{{ t.nav_metrics }}</a>
    </nav>
  </div>
</div>
<div class="sub">{{ t.updated }}: {{ now }} (Europe/Belgrade)</div>

{% block content %}{% endblock %}

</body>
</html>
